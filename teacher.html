<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم -منورة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- حماية الصفحة: التأكد من صلاحية المعلم -->
    <script>
        if (localStorage.getItem('midrak_role') !== 'teacher') {
            alert('عذراً، غير مسموح لك بالدخول لهذه الصفحة!');
            window.location.href = 'index.html';
        }
    </script>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold text-warning">لوحة تحكم المعلم</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">تسجيل الخروج</button>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <!-- رفع الفيديوهات -->
            <div class="col-md-6">
                <div class="card shadow-sm p-4 border-0">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-video text-primary me-2"></i>رفع درس جديد</h5>
                    <div class="mb-3">
                        <label class="form-label">عنوان الدرس</label>
                        <input type="text" id="vTitle" class="form-control" placeholder="مثال: دورة C# متقدمة">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">رابط الفيديو</label>
                        <input type="text" id="vUrl" class="form-control" placeholder="https://...">
                    </div>
                    <button class="btn btn-primary w-100" onclick="uploadVideo()">نشر للطلاب</button>
                </div>
            </div>

            <!-- إضافة التمارين -->
            <div class="col-md-6">
                <div class="card shadow-sm p-4 border-0">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-file-pen text-success me-2"></i>إضافة تمرين للطلاب</h5>
                    <div class="mb-3">
                        <label class="form-label">نص السؤال</label>
                        <input type="text" id="qText" class="form-control" placeholder="السؤال...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الإجابة النموذجية</label>
                        <input type="text" id="qAns" class="form-control" placeholder="الإجابة...">
                    </div>
                    <button class="btn btn-success w-100" onclick="addQuiz()">إضافة التمرين</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function uploadVideo() {
            let title = document.getElementById('vTitle').value;
            let url = document.getElementById('vUrl').value;
            if(!title || !url) return alert('املأ البيانات!');

            let videos = JSON.parse(localStorage.getItem('midrak_videos')) || [];
            videos.push({title, url});
            localStorage.setItem('midrak_videos', JSON.stringify(videos));
            alert('تم نشر الفيديو بنجاح للطلاب!');
            document.getElementById('vTitle').value = '';
            document.getElementById('vUrl').value = '';
        }

        function addQuiz() {
            let q = document.getElementById('qText').value;
            let ans = document.getElementById('qAns').value;
            if(!q || !ans) return alert('املأ البيانات!');

            let quizzes = JSON.parse(localStorage.getItem('midrak_quizzes')) || [];
            quizzes.push({q, ans});
            localStorage.setItem('midrak_quizzes', JSON.stringify(quizzes));
            alert('تم إضافة التمرين بنجاح!');
            document.getElementById('qText').value = '';
            document.getElementById('qAns').value = '';
        }

        function logout() {
            localStorage.removeItem('midrak_role');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
