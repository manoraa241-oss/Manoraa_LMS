<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة منورة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-warning"><i class="fa-solid fa-graduation-cap me-2"></i>منصة منورة</h3>
            <p class="text-muted small">يرجى تسجيل الدخول للمتابعة</p>
        </div>

        <div class="mb-3">
            <label class="form-label">اسم المستخدم (Username)</label>
            <input type="text" id="username" class="form-control" placeholder="teacher أو student">
        </div>
        <div class="mb-3">
            <label class="form-label">كلمة المرور (Password)</label>
            <input type="password" id="password" class="form-control" placeholder="123456">
        </div>
        <button class="btn btn-primary w-100 py-2" onclick="login()">دخول</button>

        <div class="mt-3 text-center text-muted small">
            <p class="mb-1">للتجربة كمعلم: <b>teacher</b> / الباسورد: <b>123456</b></p>
            <p class="mb-0">للتجربة كطالب: <b>student</b> / الباسورد: <b>12345</b></p>
        </div>
    </div>

    <script>
        function login() {
            let user = document.getElementById('username').value.trim();
            let pass = document.getElementById('password').value.trim();

            if (user === 'teacher' && pass === '123456') {
                // حفظ الجلسة في المتصفح بأن المستخدم الحالي هو معلم
                localStorage.setItem('midrak_role', 'teacher');
                window.location.href = 'teacher.html';
            } else if (user === 'student' && pass === '12345') {
                // حفظ الجلسة بأن المستخدم طالب
                localStorage.setItem('midrak_role', 'student');
                window.location.href = 'student.html';
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
            }
        }
    </script>
</body>
</html>
