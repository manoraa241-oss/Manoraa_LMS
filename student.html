<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطالب - مِدرَك</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- حماية الصفحة: التأكد من صلاحية الطالب -->
    <script>
        if (localStorage.getItem('midrak_role') !== 'student') {
            alert('عذراً، هذه الصفحة مخصصة للطلاب فقط!');
            window.location.href = 'index.html';
        }
    </script>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold text-success">لوحة تحكم الطالب</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">تسجيل الخروج</button>
    </nav>

    <div class="container py-5">
        <h3 class="fw-bold mb-4">الفيديوهات الدراسية المتاحة</h3>
        <div class="row g-4 mb-5" id="videosContainer">
            <!-- يتم جلب الفيديوهات هنا -->
        </div>

        <h3 class="fw-bold mb-4">التمارين والاختبارات</h3>
        <div class="card shadow-sm p-4 border-0">
            <div id="quizContainer">
                <!-- يتم جلب التمارين هنا -->
            </div>
        </div>
    </div>

    <script>
        // جلب وعرض الفيديوهات التي رفعها المعلم
        function loadVideos() {
            let container = document.getElementById('videosContainer');
            let videos = JSON.parse(localStorage.getItem('midrak_videos')) || [];

            if(videos.length === 0) {
                container.innerHTML = '<p class="text-muted">لا توجد فيديوهات مرفوعة حتى الآن.</p>';
                return;
            }

            videos.forEach(v => {
                container.innerHTML += `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="fw-bold">${v.title}</h5>
                                <a href="${v.url}" target="_blank" class="btn btn-sm btn-primary mt-2"><i class="fa-solid fa-play me-1"></i> مشاهدة الدرس</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // جلب التمارين
        function loadQuizzes() {
            let container = document.getElementById('quizContainer');
            let quizzes = JSON.parse(localStorage.getItem('midrak_quizzes')) || [];

            if(quizzes.length === 0) {
                container.innerHTML = '<p class="text-muted">لا توجد تمارين حالياً.</p>';
                return;
            }

            quizzes.forEach((q, index) => {
                container.innerHTML += `
                    <div class="mb-3">
                        <p class="fw-bold">السؤال ${index + 1}: ${q.q}</p>
                        <div class="input-group">
                            <input type="text" id="ans_${index}" class="form-control" placeholder="اكتب إجابتك هنا...">
                            <button class="btn btn-outline-success" onclick="checkAnswer(${index}, '${q.ans}')">إرسال الحل</button>
                        </div>
                        <p id="res_${index}" class="mt-2 text-success fw-bold"></p>
                    </div>
                `;
            });
        }

        function checkAnswer(index, correctAnswer) {
            let userAns = document.getElementById(`ans_${index}`).value.trim();
            let res = document.getElementById(`res_${index}`);

            if(userAns === correctAnswer) {
                res.innerHTML = "✅ إجابة صحيحة! أحسنت.";
                res.className = "mt-2 text-success fw-bold";
            } else {
                res.innerHTML = "❌ إجابة خاطئة، حاول مرة أخرى.";
                res.className = "mt-2 text-danger fw-bold";
            }
        }

        function logout() {
            localStorage.removeItem('midrak_role');
            window.location.href = 'index.html';
        }

        window.onload = () => {
            loadVideos();
            loadQuizzes();
        };
    </script>
</body>
</html>
